spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Explicit routes only. The discovery locator is disabled so new services are never exposed by accident.
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

spring.cloud.gateway.server.webflux.routes[0].id=authentication-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://authentication-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/authentication-service/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[1].id=customer-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://customer-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/customer-service/customers/**,/customer-service/customers
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[2].id=product-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://product-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/product-service/products/**,/product-service/products
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[3].id=order-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/order-service/orders/**,/order-service/orders
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[4].id=payment-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://payment-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/payment-service/payments/**,/payment-service/payments
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[5].id=notification-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/notification-service/notifications/**,/notification-service/notifications
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[6].id=analytics-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://analytics-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/analytics-service/analytics/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=StripPrefix=1

management.endpoints.web.exposure.include=health,info

# CORS is applied once, here. In development the Vite proxy makes calls same-origin, so this
# only matters when the frontend is served from a different origin.
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${SHOPSMART_ALLOWED_ORIGIN:http://localhost:5173}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type,Idempotency-Key,X-Trace-Id
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposed-headers=X-Trace-Id,Idempotent-Replayed
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
