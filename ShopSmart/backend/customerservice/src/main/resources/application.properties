spring.application.name=customer-service
server.port=8081

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator
management.endpoints.web.exposure.include=health,info

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:33006/shopsmart_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# Works with MySQL or PostgreSQL/Supabase: the driver is chosen from DB_URL.
# Supabase: DB_URL=jdbc:postgresql://<pooler-host>:6543/postgres?sslmode=require&prepareThreshold=0
# and keep DB_POOL_SIZE small (3) so all services fit in the Supabase connection pool.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

logging.level.org.springframework.web=INFO

# Security
shopsmart.security.jwt-secret=${JWT_SECRET:}
shopsmart.security.internal-api-key=${INTERNAL_API_KEY:}

# DB activity log (logs/<service>-db.log). Metadata only, never parameter values.
shopsmart.db-log.enabled=${DB_LOG_ENABLED:true}
shopsmart.db-log.slow-query-ms=${DB_LOG_SLOW_MS:500}

# Internal service addresses used for promotions and account erasure
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8083}

# DPDP retention: personal data is erased this many seconds after a deletion request
# (short for the demo; a real shop would use days). The sweep runs every sweep-seconds.
shopsmart.retention.erase-after-seconds=${RETENTION_ERASE_AFTER_SECONDS:120}
shopsmart.retention.sweep-seconds=${RETENTION_SWEEP_SECONDS:30}
