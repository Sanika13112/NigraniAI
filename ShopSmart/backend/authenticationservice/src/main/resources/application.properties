spring.application.name=authentication-service
server.port=8083

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:33006/shopsmart_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# Works with MySQL or PostgreSQL/Supabase: the driver is chosen from DB_URL.
# Supabase: DB_URL=jdbc:postgresql://<pooler-host>:6543/postgres?sslmode=require&prepareThreshold=0
# and keep DB_POOL_SIZE small (3) so all services fit in the Supabase connection pool.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Logging
logging.level.com.shopsmart.authenticationservice=INFO
logging.level.org.springframework.web=INFO

# Security (required: no defaults for secrets)
shopsmart.security.jwt-secret=${JWT_SECRET:}
shopsmart.security.jwt-issuer=shopsmart-auth
shopsmart.security.internal-api-key=${INTERNAL_API_KEY:}
shopsmart.security.access-token-minutes=${ACCESS_TOKEN_MINUTES:15}
shopsmart.security.refresh-token-days=${REFRESH_TOKEN_DAYS:7}
# Set COOKIE_SECURE=false only for local HTTP development
shopsmart.security.cookie-secure=${COOKIE_SECURE:true}
# Version of the Terms and Conditions now in force. Must match TERMS_VERSION in frontend/src/lib/terms.ts.
shopsmart.terms.version=${TERMS_VERSION:2026-10-15}

# First administrator (optional; created once if absent)
shopsmart.admin.email=${ADMIN_EMAIL:}
shopsmart.admin.password=${ADMIN_PASSWORD:}

customer.service.url=${CUSTOMER_SERVICE_URL:http://localhost:8081}

# DB activity log (logs/<service>-db.log). Metadata only, never parameter values.
shopsmart.db-log.enabled=${DB_LOG_ENABLED:true}
shopsmart.db-log.slow-query-ms=${DB_LOG_SLOW_MS:500}
