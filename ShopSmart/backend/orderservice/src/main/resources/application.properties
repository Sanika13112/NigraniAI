spring.application.name=order-service
server.port=8084

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:33006/shopsmart_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# Works with MySQL or PostgreSQL/Supabase: the driver is chosen from DB_URL.
# Supabase: DB_URL=jdbc:postgresql://<pooler-host>:6543/postgres?sslmode=require&prepareThreshold=0
# and keep DB_POOL_SIZE small (3) so all services fit in the Supabase connection pool.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}
product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8082}
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8085}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Eureka Discovery
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Logging
logging.level.com.shopsmart.orderservice=INFO
logging.level.org.springframework.web=INFO

# Security
shopsmart.security.jwt-secret=${JWT_SECRET:}
shopsmart.security.internal-api-key=${INTERNAL_API_KEY:}

# Store policy (no invented charges: defaults are free delivery, GST-inclusive prices)
shopsmart.shipping.flat-fee=${SHIPPING_FLAT_FEE:0}
shopsmart.shipping.free-above=${SHIPPING_FREE_ABOVE:0}
shopsmart.orders.payment-window-minutes=${PAYMENT_WINDOW_MINUTES:30}
shopsmart.orders.return-window-days=${RETURN_WINDOW_DAYS:7}

# DB activity log (logs/<service>-db.log). Metadata only, never parameter values.
shopsmart.db-log.enabled=${DB_LOG_ENABLED:true}
shopsmart.db-log.slow-query-ms=${DB_LOG_SLOW_MS:500}
